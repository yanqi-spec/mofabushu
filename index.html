<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小米运动刷步数</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 13px;
            color: #888;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .step-presets {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .step-presets button {
            flex: 1;
            min-width: 70px;
            padding: 8px 0;
            border: 1px solid #ddd;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #555;
            transition: all 0.2s;
        }
        .step-presets button:hover {
            background: #667eea;
            color: #fff;
            border-color: #667eea;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
            word-break: break-all;
        }
        .result.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .result.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        .result.loading {
            display: block;
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #bbdefb;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #1565c0;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .note {
            margin-top: 16px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">🚶</div>
            <h1>小米运动刷步数</h1>
            <p>支持小米运动 / 微信 / 支付宝</p>
        </div>
        <form id="stepForm">
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="user" placeholder="手机号或邮箱" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="pwd" placeholder="小米运动账号密码" required>
            </div>
            <div class="form-group">
                <label>目标步数</label>
                <input type="number" id="step" placeholder="最大 98800 步" min="1" max="98800" required>
                <div class="step-presets">
                    <button type="button" onclick="setStep(5000)">5000</button>
                    <button type="button" onclick="setStep(10000)">10000</button>
                    <button type="button" onclick="setStep(20000)">20000</button>
                    <button type="button" onclick="setStep(30000)">30000</button>
                    <button type="button" onclick="setStep(98800)">98800</button>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">立即刷步</button>
        </form>
        <div class="result" id="result"></div>
        <div class="note">接口地址：api.suyanw.cn</div>
    </div>

    <script>
        // ========== 新接口地址 ==========
        const API_URL = 'https://api.suyanw.cn/api/xiaomi.php';

        function setStep(step) {
            document.getElementById('step').value = step;
        }

        document.getElementById('stepForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const user = document.getElementById('user').value.trim();
            const pwd = document.getElementById('pwd').value.trim();
            const step = document.getElementById('step').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');

            // 简单校验
            if (!user || !pwd || !step) {
                showResult('请填写完整的账号、密码和步数', 'error');
                return;
            }
            if (parseInt(step) > 98800 || parseInt(step) < 1) {
                showResult('步数范围为 1 ~ 98800', 'error');
                return;
            }

            // 构建请求 URL（使用常见参数名：phone, password, step）
            const url = `${API_URL}/?phone=${encodeURIComponent(user)}&password=${encodeURIComponent(pwd)}&step=${encodeURIComponent(step)}`;

            // 显示加载状态
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            resultDiv.className = 'result loading';
            resultDiv.innerHTML = '<span class="spinner"></span>正在请求接口...';

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors'
                });

                // 尝试解析 JSON
                let data;
                try {
                    data = await response.json();
                } catch (jsonErr) {
                    // 如果不是 JSON，显示原始文本
                    const text = await response.text();
                    showResult('接口返回异常（非 JSON）：' + text.substring(0, 200), 'error');
                    return;
                }

                // 显示返回结果（兼容多种返回格式）
                if (data.code === 200 || data.success === true || data.status === 'success') {
                    showResult('✅ 刷步成功！\n' + JSON.stringify(data, null, 2), 'success');
                } else if (data.code === 200 && !data.success) {
                    showResult('✅ 请求完成\n' + JSON.stringify(data, null, 2), 'success');
                } else {
                    showResult('❌ 刷步失败\n' + JSON.stringify(data, null, 2), 'error');
                }

            } catch (err) {
                let errorMsg = err.message;
                if (errorMsg.includes('CORS') || errorMsg.includes('fetch')) {
                    errorMsg = '请求被阻止（可能是跨域限制）。\n\n' +
                               '解决方法：\n' +
                               '1. 安装浏览器 CORS 插件（如 Allow CORS）\n' +
                               '2. 或使用后端代理转发请求\n' +
                               '3. 或直接在浏览器地址栏输入完整 URL 测试';
                }
                showResult('❌ 网络错误：' + errorMsg, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '立即刷步';
            }
        });

        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result ' + type;
            resultDiv.textContent = message;
        }

        // 浏览器地址栏直接测试示例
        // https://api.suyanw.cn/api/xiaomi.php?phone=你的账号&password=你的密码&step=98800
    </script>
</body>
</html>
